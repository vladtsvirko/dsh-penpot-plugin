- insert:
    - id: dsh-penpot
      name: dsh-penpot-plugin
      config:
        # Both are required for a working backend. The Plugins page writes them
        # to the profile's user layer; these environment expressions are the
        # fallback for a headless or older runtime. An empty pair is supported:
        # the plugin still loads and penpot_status reports that it is not
        # configured.
        apiUrl: !!js process.env.PENPOT_API_URL ?? ""
        token: !!js process.env.PENPOT_ACCESS_TOKEN ?? ""
