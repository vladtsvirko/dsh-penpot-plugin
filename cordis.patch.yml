- insert:
    - id: dsh-penpot
      name: dsh-penpot-plugin
      config:
        # Both are required for a working backend; the environment is the safe
        # place for them. An empty pair is supported: the plugin still loads and
        # penpot_status reports that it is not configured.
        apiUrl: !!js process.env.PENPOT_API_URL ?? ""
        token: !!js process.env.PENPOT_ACCESS_TOKEN ?? ""
